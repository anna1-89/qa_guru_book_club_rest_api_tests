plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
    id "io.freefair.lombok" version "9.2.0"
}

repositories {
    mavenCentral()
}


allure {
    report {
        version.set("2.32.0")
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("2.32.0") //версия интеграции фреймворка и Allure
            }
        }
    }
}


dependencies {
    testImplementation(
            "io.rest-assured:rest-assured:6.0.0",
            "io.qameta.allure:allure-rest-assured:2.32.0",
            "io.rest-assured:json-schema-validator:6.0.0",
            "org.junit.jupiter:junit-jupiter:5.9.3",
            "net.datafaker:datafaker:2.5.4",
            "tools.jackson.core:jackson-databind:3.1.0",
            "org.assertj:assertj-core:3.27.7",
            "org.slf4j:slf4j-simple:2.0.17"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

